[phases.setup]
nixPkgs = ['php82', 'php82Packages.composer', 'nodejs-18_x']

[phases.install]
cmds = [
    'composer install --no-dev --optimize-autoloader',
    'npm install',
    'npm run build',
    'chmod -R 755 storage',
    'chmod -R 755 bootstrap/cache'
]

#[phases.build]
# Never run DB migrations during image build; database isn't reachable in build stage
#cmds = ['php artisan migrate --force']

# Do not run `optimize:clear` here: it flushes the DB cache driver and fails if MySQL is unreachable
# or still starting; Railway often misconfigures DB_HOST as 127.0.0.1. Migrations are enough for boot.
[start]
cmd = 'php artisan migrate --force --no-interaction && php -d display_errors=1 -d variables_order=EGPCS -S 0.0.0.0:$PORT -t public server.php'
